name: Deploy Contractor Web

# `main` is the deploy branch: merging into it ships to production. `dev` is where
# work lands first, and reaches main through a PR whose checks must pass.
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: esw-contractor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: write }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run test:run
      # No check-contract-sync step: that script lives in the workspace root, which
      # is a separate repo that gitignores this one. It stays a local pre-push check.

      # `bun run build` runs vue-tsc first. VITE_* is inlined at build time, so this
      # value is baked into the bundle — changing it needs a rebuild, not a restart.
      # Set it as a repo variable: Settings → Secrets and variables → Actions → Variables.
      - run: bun run build
        env:
          VITE_APP_API_URL: ${{ vars.VITE_APP_API_URL }}

      # wrangler invoked directly rather than through cloudflare/wrangler-action.
      # The action wraps the CLI and reports only "The process failed with exit code 1",
      # swallowing wrangler's own stderr — it hid two different failures in a row here
      # (a bun-install break, then the deploy itself). Calling the CLI puts the real
      # message in the log. It also drops a dependency for one line, which is the trade
      # the action was never earning.
      #
      # Requires the Pages project to already exist as a DIRECT UPLOAD project:
      #   wrangler pages project create esw-contractor --production-branch=main
      # `pages deploy` does not create one non-interactively.
      - name: Deploy to Cloudflare Pages
        run: |
          bunx wrangler@4.127.0 pages deploy dist \
            --project-name=esw-contractor \
            --branch="${{ github.head_ref || github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
